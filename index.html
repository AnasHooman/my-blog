<!DOCTYPE html>
<html lang="ko">
<head>
<script>
(function () {
  var stored = localStorage.getItem('blog-theme');
  var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Blog</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="index.html">My Blog</a>
  <button id="theme-toggle" aria-label="다크모드 전환" aria-pressed="false">🌙</button>
</header>

<main id="post-list" class="container">
  <p class="loading">글을 불러오는 중...</p>
</main>

<footer class="site-footer">
  <p>&copy; 2026 My Blog</p>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
